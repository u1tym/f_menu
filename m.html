<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF2D9">
  <title>PORTAL — メニュー</title>
  <style>
    :root {
      --cream-top: #fff9ec;
      --cream-mid: #fff2d9;
      --cream-bottom: #f2e4c8;
      --icon-border: #5c3d2e;
      --icon-border-soft: #7a5542;
      --ink: #2f2118;
      --ink-soft: rgba(47, 33, 24, 0.55);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      color: var(--ink);
      min-height: 100dvh;
      background-color: var(--cream-mid);
      background-image: linear-gradient(
        168deg,
        var(--cream-top) 0%,
        var(--cream-mid) 42%,
        var(--cream-bottom) 100%
      );
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: calc(1.25rem + var(--safe-top)) 1.25rem calc(2rem + var(--safe-bottom));
    }

    .brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .brand img,
    .grid a img {
      border-radius: 50%;
      border: 3px solid var(--icon-border);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.35) inset,
        0 10px 22px rgba(62, 42, 32, 0.2),
        0 4px 10px rgba(62, 42, 32, 0.14),
        0 0 0 1px var(--icon-border-soft);
    }

    .brand img {
      display: block;
      width: min(200px, 52vw);
      height: auto;
      margin: 0 auto;
    }

    .brand h1 {
      margin: 1rem 0 0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.55em;
      text-indent: 0.55em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.1rem;
    }

    .grid a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      padding: 0.35rem 0 0.5rem;
      border-radius: 1.1rem;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .grid a:active {
      transform: scale(0.96);
      opacity: 0.92;
    }

    .grid a img {
      width: 100%;
      max-width: 148px;
      height: auto;
      display: block;
    }

    .grid a span {
      margin-top: 0.55rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <img src="images/PORTAL.jpg" alt="PORTAL" width="400" height="400">
      <h1>Portal</h1>
    </header>

    <nav class="grid" aria-label="メインメニュー">
      <a href="knowhow/">
        <img src="images/KNOWHOW.jpg" alt="" width="400" height="400">
        <span>ノウハウ</span>
      </a>
      <a href="goods/">
        <img src="images/GOODS.jpg" alt="" width="400" height="400">
        <span>グッズ</span>
      </a>
      <a href="cashe/">
        <img src="images/MONEY.jpg" alt="" width="400" height="400">
        <span>お金</span>
      </a>
      <a href="schedule/">
        <img src="images/SCHEDULE.jpg" alt="" width="400" height="400">
        <span>スケジュール</span>
      </a>
    </nav>
  </div>
  <script>
    (function () {
      var nav = document.querySelector("nav.grid");
      if (!nav) return;

      nav.addEventListener("click", function (e) {
        var a = e.target.closest("a[href]");
        if (!a || !nav.contains(a)) return;

        e.preventDefault();

        var url = new URL(a.getAttribute("href"), window.location.href);
        var n = Math.floor(Math.random() * 999999999) + 1;
        url.searchParams.set("a", String(n));

        window.location.assign(url.href);
      });
    })();
  </script>
</body>
</html>
